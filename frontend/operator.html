<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator | CRM</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app">
    <!-- LOGIN -->
    <section class="login" id="operatorLoginScreen">
      <div class="login-card">
        <h1>Operator CRM</h1>
        <p>Sending checks for shifts</p>

        <form id="operatorLoginForm">
          <input type="email" id="operatorEmail" placeholder="Email" required />
          <input type="password" id="operatorPassword" placeholder="Пароль" required />
          <button type="submit">Login</button>
        </form>

        <span id="operatorLoginError"></span>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section class="operator-page hidden" id="operatorDashboard">
      <div class="operator-shell">
        <header class="operator-topbar">
          <div>
            <h1>Operators panel</h1>
            <p>Filling out checks to send to the administrator</p>
          </div>
          <button id="operatorLogoutBtn">Выйти</button>
        </header>

        <section class="operator-card">
          <h2>New check</h2>

          <form class="check-form" id="operatorCheckForm">
            <!-- MODEL -->
            <div class="field">
              <label>Operator name + models</label>
              <input
                type="text"
                id="modelName"
                placeholder="operator + model"
                required
              />
            </div>

            <!-- DATE -->
            <div class="field">
              <label>Date</label>
              <input type="date" id="checkDate" required />
            </div>

            <!-- SHIFT -->
            <div class="field">
              <label>shift</label>
              <select id="checkShift" required>
                <option value="">Select shift</option>
                <option value="1">1st shift</option>
                <option value="2">2nd shift</option>
              </select>
            </div>

            <!-- 🔥 DYNAMIC PLATFORMS -->
            <div class="platforms-grid full" id="platformFields"></div>

            <!-- BUTTON -->
            <button class="full" type="submit">
              Send a check 
            </button>
          </form>

          <p class="form-message" id="operatorCheckMessage"></p>
        </section>
      </div>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/operator.js"></script>
</body>
</html>
